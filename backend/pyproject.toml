[project]
name = "complaint-management-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-openai>=1.3.5",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.9",
    "langsmith>=0.10.6",
    "pydantic-settings>=2.14.2",
    "qdrant-client>=1.18.0",
    "sse-starlette>=3.4.5",
    "supabase>=2.31.0",
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.51.0",
]

[tool.ruff.lint.isort]
# The application packages sit directly under backend/ rather than inside a
# single importable package, so ruff cannot infer which top-level names are
# ours — without this it files them under third-party and reshuffles imports on
# every save.
known-first-party = [
    "api",
    "config",
    "db",
    "guardrails",
    "ingestion",
    "llm",
    "observability",
    "rag",
    "retrieval",
    "schemas",
    "services",
]
