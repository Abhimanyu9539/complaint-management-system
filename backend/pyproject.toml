[project]
name = "complaint-management-system"
version = "0.1.0"
description = "FastAPI backend for the complaint management system — RAG-based complaint triage and resolution drafting over Supabase and Qdrant."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    # Deployed as a container image, never published. This classifier makes
    # PyPI reject an upload outright rather than relying on nobody typing it.
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.139.2",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "jq>=1.12.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.3.5",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-voyageai>=0.4.1",
    "langgraph>=1.2.9",
    "langsmith>=0.10.6",
    "pydantic-settings>=2.14.2",
    "qdrant-client>=1.18.0",
    "sse-starlette>=3.4.5",
    "supabase>=2.31.0",
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.51.0",
]

# The API server is `uvicorn cms.main:app`; these are the operational one-shots
# plus the read-only probes. All are safe to re-run — see each module's docstring.
[project.scripts]
cms-seed = "cms.cli.seed:main"
cms-create-collections = "cms.cli.create_collections:main"
cms-reindex = "cms.cli.reindex:main"
cms-analyze = "cms.cli.analyze:main"
cms-retrieve = "cms.cli.retrieve:main"
cms-graph = "cms.cli.graph:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src layout: one importable top-level name (`cms`) instead of the eleven
# generic ones (config, db, schemas, services, ...) that used to sit directly
# under backend/ and would collide with anything else in site-packages.
[tool.hatch.build.targets.wheel]
packages = ["src/cms"]

[tool.uv]
# This machine sits behind a TLS-intercepting proxy whose root CA is in the
# Windows certificate store but not in the bundle uv ships, so uv's own HTTPS
# fails with "invalid peer certificate: UnknownIssuer" without this. It is the
# uv-side counterpart to the truststore injection in cms/config/__init__.py.
native-tls = true

[dependency-groups]
dev = [
    "deepeval>=4.2.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite is async end to end (the repositories are async, so anything that
# reaches them is too). "auto" treats every `async def test_*` as a coroutine
# test without a per-test marker.
asyncio_mode = "auto"

[tool.ruff.lint.isort]
known-first-party = ["cms"]
