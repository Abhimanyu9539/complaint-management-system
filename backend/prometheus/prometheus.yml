# Scrapes the API running on the host (uvicorn on port 8000), like n8n reaches it.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: cms-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
